<!DOCTYPE html>
<html lang="ca">
<head>
    <meta name="google-site-verification" content="n4wFLcRQBu5hvzynguDkyZ1FInSqiuurzVhHqmm0lmg" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prova Competències Bàsiques</title>
    <link rel="stylesheet" href="shared.css?v=23">
</head>
<body>

    <div id="avis-rotacio">
        <div class="icona-mobil"></div>
        <h2>Gira el dispositiu</h2>
        <p>Per a una millor experiència, aquesta prova s'ha de realitzar amb la pantalla en horitzontal.</p>
    </div>

    <div id="app-container">
        <div id="columna-a">
            <header>
                <h1 class="titol-reduit" id="titol-principal">Matemàtiques ESO</h1>
            </header>
            
            <div id="zona-enunciat">
                <img id="img-enunciat" src="" alt="Enunciat de l'activitat" class="element-suau">
                <!-- Enunciat d'una pregunta anterior (consulta): no toca l'enunciat de la pregunta actual -->
                <img id="img-enunciat-revisio" src="" alt="Enunciat d'una pregunta anterior" class="amagat">
            </div>
        </div>

        <div id="columna-b">
            <header>
                <p id="comptador-preguntes">Carregant preguntes...</p>
                <!-- Consulta de les preguntes anteriors (només lectura): la pinta core.js -->
                <nav id="navegacio" aria-label="Preguntes anteriors" style="display: none;">
                    <button id="btn-anterior" class="btn-nav" type="button" style="display: none;">← Pregunta anterior</button>
                    <button id="btn-posterior" class="btn-nav" type="button" style="display: none;">Següent →</button>
                    <button id="btn-tornar" class="btn-nav btn-tornar" type="button" style="display: none;">Tornar a la pregunta actual</button>
                </nav>
            </header>

            <!-- Pregunta anterior en mode consulta: les opcions no es poden clicar -->
            <div id="zona-revisio" class="amagat">
                <p class="avis-revisio">👁 Només per consultar.</p>
                <div class="zona-img-revisio">
                    <img id="img-pregunta-revisio" src="" alt="Pregunta anterior">
                </div>
                <div id="opcions-revisio"></div>
            </div>

            <div id="zona-pregunta">
                <img id="img-pregunta" src="" alt="Pregunta" class="element-suau">
            </div>

            <div id="opcions-container" class="element-suau">
                </div>

            <div id="zona-seguent" style="margin-top: 30px; text-align: right;">
                <button id="btn-seguent" class="btn-next" style="display: none;">Pregunta següent</button>
            </div>

            <div id="pantalla-final" style="display: none; padding: 20px; text-align: center;">
                <h2>🎉 Prova finalitzada</h2>
                <div id="resum-detallat"></div>

                <div class="caixa-codi">
    <!-- El contingut real el genera core.js a finalitzarProva() -->
                </div>
            </div>
        </div>
    </div>

    <script src="codi.js?v=1"></script>
    <script src="core.js?v=27"></script>
</body>
</html>
