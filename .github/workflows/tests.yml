# Comprova que la documentació (README.md) diu el mateix que les dades:
# nombre de preguntes, anys de cada nivell, imatges sense fer servir i rutes
# citades (tests/docs_vs_codi.py, només biblioteca estàndard).
# S'executa a cada canvi a main, a cada pull request i a mà. No escriu res.
# Els commits del bot dels ZIP no el disparen per si sols (regla de GitHub):
# per això unzip-upload.yml el llança després de desar.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proves:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Documentació ↔ codi
        run: python3 tests/docs_vs_codi.py
