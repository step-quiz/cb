<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="n4wFLcRQBu5hvzynguDkyZ1FInSqiuurzVhHqmm0lmg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Activitat interactiva de matemàtiques">
  <title>Generador d'Exàmens CB</title>

  <style>
    :root {
      --text-main: #1e293b;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --eso-bg: #eff6ff;
      --accent: #3b82f6;
      --border-heavy: #cbd5e1;
      --panel-w: 420px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-body);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      padding: 15px;
      padding-top: 10px; /* Reduït al mínim */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .title-container { text-align: center; margin-bottom: 10px; } /* Reduït espai sota títol */
    .title-row-1 { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 32px; font-weight: 800; color: var(--text-main); margin: 0; }
    .title-row-2 { font-size: 22px; font-weight: 400; color: var(--accent); margin-top: -5px; }

    .title-row-1, .title-row-2, .main-wrapper { opacity: 0; animation: fade-in 0.4s ease-out forwards; }
    .title-row-2 { animation-delay: 0.2s; }
    .main-wrapper { animation-delay: 0.4s; }

    @keyframes fade-in { 
      from { opacity: 0; transform: translateY(15px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    .main-wrapper { display: flex; justify-content: center; align-items: flex-start; flex-wrap: wrap; gap: 16px; width: 100%; max-width: 1000px; }
    
    .quiz-panel { 
      width: var(--panel-w); 
      max-width: 100%; 
      padding: 15px 25px 15px 25px; /* Padding vertical reduït */
      border-radius: 16px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); 
      border: 1px solid var(--border-heavy); 
      background-color: var(--eso-bg); 
    }

    h2 { margin: 0 0 12px 5px; font-size: 20px; font-weight: 800; text-align: center; } /* Margin bottom reduït */
    
    .row { display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 10px; margin-bottom: 12px; }
    .row label { font-size: 14px; font-weight: 600; text-align: right; color: var(--text-main); }
    
    select { 
      appearance: none; 
      background-color: #ffffff; 
      height: 36px; 
      padding: 0 10px; 
      font-size: 14px; 
      border: 1px solid var(--border-heavy); 
      border-radius: 6px; 
      cursor: pointer; 
      text-align: center; 
      width: 100%; 
      font-weight: 500; 
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    .link-block { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08); }
    
    .btn-row { display: flex; gap: 8px; margin-top: 0; } /* Ara a dalt del bloc */

    .link-label { 
      font-size: 12px; 
      font-weight: 700; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      margin-top: 15px; 
      margin-bottom: 8px; 
      display: block; 
      text-align: center;
    }

    textarea.link-output { 
      width: 100%; 
      height: 38px; /* Més estret */
      resize: none; 
      font-family: monospace; 
      font-size: 13px; 
      padding: 8px 10px; 
      border-radius: 6px; 
      border: 1px solid var(--border-heavy); 
      background: #e2e8f0; 
      word-break: break-all; 
      color: var(--text-main); 
    }

    .copy-btn, .open-btn { 
      flex: 1; 
      height: 40px; 
      cursor: pointer; 
      border-radius: 6px; 
      font-weight: 700; 
      font-size: 14px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border: none; 
      gap: 6px; 
      transition: all 0.2s ease; 
    }
    
    .copy-btn { background: #ffffff; color: var(--text-main); border: 1px solid var(--border-heavy); }
    .open-btn { background: var(--accent); color: white; } /* Color blau viu */
    .open-btn:hover { background: #2563eb; }

    .copy-status { font-size: 13px; color: #059669; margin-top: 5px; min-height: 15px; font-weight: 700; text-align: center; }

    /* ── Tria de preguntes ── */
    .tria-btn {
      appearance: none;
      background-color: #ffffff;
      height: 36px;
      padding: 0 10px;
      font-family: inherit;
      font-size: 14px;
      border: 1px solid var(--border-heavy);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      width: 100%;
      font-weight: 500;
      color: var(--text-main);
      transition: all 0.15s ease;
    }
    .tria-btn:hover:not(:disabled) { border-color: var(--accent); }
    .tria-btn[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    .tria-btn:disabled { cursor: default; color: var(--text-muted); background: #f1f5f9; }

    .tria-panel {
      width: 330px;
      max-width: 100%;
      padding: 15px 18px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-heavy);
      background-color: #ffffff;
    }
    .tria-panel[hidden] { display: none; }
    .tria-cap { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .tria-cap h3 { margin: 0; font-size: 16px; font-weight: 800; }
    .tria-compte { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }

    .tria-accions { display: flex; gap: 6px; margin-bottom: 10px; }
    .tria-accions button {
      flex: 1; height: 30px; font-family: inherit; font-size: 13px; font-weight: 600;
      color: var(--text-main); background: #ffffff; border: 1px solid var(--border-heavy);
      border-radius: 6px; cursor: pointer; transition: all 0.15s ease;
    }
    .tria-accions button:hover { border-color: var(--accent); color: var(--accent); }

    .tria-llista { max-height: 340px; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
    .tria-item { display: flex; align-items: center; gap: 9px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
    .tria-item:hover { background: var(--eso-bg); }
    .tria-item input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
    .tria-item span { font-size: 13px; line-height: 1.35; }
    .tria-item input:not(:checked) + span { color: var(--text-muted); }

    .tria-avis { margin-top: 10px; font-size: 12px; line-height: 1.45; color: #92400e; background: #fef3c7; border-radius: 6px; padding: 8px 10px; }
    .tria-avis[hidden] { display: none; }
    .tria-buit { font-size: 13px; color: var(--text-muted); text-align: center; padding: 20px 0; }

    /* Animació atenció */
    .select-atencio-shake { animation: blink-bg 0.4s 6, shake-select 2.5s ease-in-out; }
    @keyframes blink-bg { 0%, 100% { background-color: #ffffff; } 50% { background-color: #e8e1ac; } }
    @keyframes shake-select { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
  </style>
</head>
<body>

  <div class="title-container">
    <h1 class="title-row-1">Matemàtiques</h1>
    <h2 class="title-row-2">Proves de competència matemàtica</h2>
  </div>

  <div class="main-wrapper">
    <div class="quiz-panel">
      <h2>Configura la prova</h2>
      
      <div class="row">
        <label for="f-practica">Mode:</label>
        <select id="f-practica">
          <option value="1">Pràctica (amb pistes)</option>
          <option value="0">Examen</option>
        </select>
      </div>

      <div class="row">
        <label for="f-nivell">Nivell:</label>
        <select id="f-nivell">
          <option value="">Tots els nivells</option>
          <option value="4eso">4t ESO (final d'etapa)</option>
          <option value="2eso">2n ESO (diagnòstica)</option>
        </select>
      </div>

      <div class="row">
        <label for="f-any">Any:</label>
        <select id="f-any"></select>
      </div>

      <div class="row">
        <label for="f-dificultat">Dificultat:</label>
        <select id="f-dificultat">
          <option value="">Totes</option>
          <option value="1">1 - Baixa</option>
          <option value="2">2 - Mitjana</option>
          <option value="3">3 - Alta</option>
        </select>
      </div>

      <div class="row">
        <label for="f-sentit">Sentit matemàtic:</label>
        <select id="f-sentit">
          <option value="">Tots</option>
          <option value="espacial">Espacial</option>
          <option value="mesura">De mesura</option>
          <option value="estocastic">Estocàstic</option>
          <option value="numeric">Numèric</option>
          <option value="algebraic">Algebraic</option>
        </select>
      </div>

      <div class="row">
        <label for="f-preguntes">Preguntes:</label>
        <button type="button" id="f-preguntes" class="tria-btn" aria-expanded="false" aria-controls="tria-panel">Totes</button>
      </div>

      <div class="link-block">
        <div class="btn-row">
          <button id="btn-copy" class="copy-btn">Copiar l'enllaç</button>
          <button id="btn-open" class="open-btn">Començar la prova</button>
        </div>
        <div id="status-msg" class="copy-status"></div>

        <span class="link-label">Enllaç generat</span>
        <textarea id="output-link" class="link-output" readonly></textarea>
      </div>
    </div>

    <div class="tria-panel" id="tria-panel" role="group" aria-labelledby="tria-titol" hidden>
      <div class="tria-cap">
        <h3 id="tria-titol">Tria les preguntes</h3>
        <span class="tria-compte" id="tria-compte"></span>
      </div>
      <div class="tria-accions">
        <button type="button" id="tria-totes">Totes</button>
        <button type="button" id="tria-cap">Cap</button>
      </div>
      <div class="tria-llista" id="tria-llista"></div>
      <p class="tria-avis" id="tria-avis" hidden></p>
    </div>
  </div>

  <script>
    const BASE_URL = 'https://cb.step-quiz.net/test.html';
    // Anys que ofereix el desplegable. Aquesta llista es refà sola llegint
    // preguntes.json en carregar la pàgina; la d'aquí només serveix de reserva
    // si el fitxer no es pot llegir (per exemple obrint l'index amb file://).
    // En afegir una edició nova no cal tocar-la: n'hi ha prou d'afegir les
    // preguntes a preguntes.json.
    let anysPerNivell = { '4eso': ['2026', '2025', '2024', '2023', '2022'], '2eso': ['2026', '2025', '2024'] };
    let bancPreguntes = null;   // preguntes.json sencer, per poder triar-les una a una

    async function carregarAnysDelBanc() {
      try {
        const resposta = await fetch('preguntes.json');
        if (!resposta.ok) return;
        const preguntes = await resposta.json();
        const perNivell = {};
        preguntes.forEach(q => { (perNivell[q.nivell] ??= new Set()).add(String(q.any)); });
        if (!Object.keys(perNivell).length) return;
        bancPreguntes = preguntes;
        anysPerNivell = Object.fromEntries(Object.entries(perNivell)
          .map(([nivell, anys]) => [nivell, [...anys].sort((a, b) => b - a)]));
        actualitzarAnys();
      } catch (err) {
        // sense accés al fitxer ens quedem amb la llista de reserva i sense tria
      }
    }

    const selPractica = document.getElementById('f-practica');
    const selNivell = document.getElementById('f-nivell');
    const selAny = document.getElementById('f-any');
    const selDificultat = document.getElementById('f-dificultat');
    const selSentit = document.getElementById('f-sentit');
    const outputLink = document.getElementById('output-link');
    const btnCopy = document.getElementById('btn-copy');
    const btnOpen = document.getElementById('btn-open');
    const statusMsg = document.getElementById('status-msg');
    const btnTria = document.getElementById('f-preguntes');
    const triaPanel = document.getElementById('tria-panel');
    const triaLlista = document.getElementById('tria-llista');
    const triaCompte = document.getElementById('tria-compte');
    const triaAvis = document.getElementById('tria-avis');

    const NOMS_SENTIT = {
      espacial: 'espacial', mesura: 'de mesura', estocastic: 'estocàstic',
      numeric: 'numèric', algebraic: 'algebraic'
    };
    const MAX_CODI = 30;        // el codi de verificació final només desa 30 resultats

    let preguntesFiltrades = [];   // les que passen els filtres, en l'ordre del banc
    let triades = new Set();       // ids que sortiran a la prova

    function actualitzarAnys() {
      const nivell = selNivell.value;
      const anyAnterior = selAny.value;
      let anys = nivell ? (anysPerNivell[nivell] || []) : [...new Set(Object.values(anysPerNivell).flat())].sort((a,b)=>b-a);

      selAny.innerHTML = '<option value="">Tots els anys</option>';
      anys.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a; opt.textContent = a;
        selAny.appendChild(opt);
      });
      if (anys.includes(anyAnterior)) selAny.value = anyAnterior;
      refrescarTria();
    }

    // Comprimeix [158,159,160,163] en "158-160,163" per no inflar l'enllaç.
    function comprimeixIds(ids) {
      const n = [...ids].sort((a, b) => a - b);
      const trossos = [];
      for (let i = 0; i < n.length;) {
        let j = i;
        while (j + 1 < n.length && n[j + 1] === n[j] + 1) j++;
        trossos.push(j - i >= 2 ? `${n[i]}-${n[j]}` : n.slice(i, j + 1).join(','));
        i = j + 1;
      }
      return trossos.join(',');
    }

    // Número d'ítem dins de la seva prova: data/cb4eso2025p7.png -> 7
    function numeroItem(p) {
      const m = /p(\d+)\.png$/.exec(p.pregunta);
      return m ? m[1] : '?';
    }

    // Només es mostra el que no s'hagi fixat abans amb els filtres.
    function etiquetaPregunta(p) {
      const trossos = [];
      if (!selNivell.value) trossos.push(p.nivell === '4eso' ? '4t ESO' : '2n ESO');
      if (!selAny.value) trossos.push(p.any);
      trossos.push('ítem ' + numeroItem(p));
      trossos.push(NOMS_SENTIT[p.sentit] || p.sentit);
      trossos.push('dificultat ' + p.dificultat);
      return trossos.join(' · ');
    }

    function recalcularFiltrades() {
      if (!bancPreguntes) { preguntesFiltrades = []; return; }
      preguntesFiltrades = bancPreguntes.filter(p =>
        (!selNivell.value || p.nivell === selNivell.value) &&
        (!selAny.value || String(p.any) === selAny.value) &&
        (!selDificultat.value || String(p.dificultat) === selDificultat.value) &&
        (!selSentit.value || p.sentit === selSentit.value));
      triades = new Set(preguntesFiltrades.map(p => p.id));   // en canviar de filtre, totes
    }

    function pintarLlista() {
      triaLlista.innerHTML = '';
      if (!preguntesFiltrades.length) {
        triaLlista.innerHTML = '<p class="tria-buit">Cap pregunta amb aquests filtres.</p>';
        return;
      }
      const fragment = document.createDocumentFragment();
      preguntesFiltrades.forEach(p => {
        const fila = document.createElement('label');
        fila.className = 'tria-item';
        const caixa = document.createElement('input');
        caixa.type = 'checkbox';
        caixa.checked = triades.has(p.id);
        caixa.dataset.id = p.id;
        const text = document.createElement('span');
        text.textContent = etiquetaPregunta(p);
        fila.append(caixa, text);
        fragment.appendChild(fila);
      });
      triaLlista.appendChild(fragment);
    }

    function pintarEstatTria() {
      const total = preguntesFiltrades.length;
      const n = triades.size;
      if (!bancPreguntes) {
        btnTria.textContent = 'Totes';
        btnTria.disabled = true;
        return;
      }
      btnTria.disabled = total === 0;
      btnTria.textContent = total === 0 ? 'Cap pregunta'
        : n === total ? `Totes (${total})`
        : `${n} de ${total}`;
      triaCompte.textContent = `${n} de ${total}`;
      const passa = n > MAX_CODI;
      triaAvis.hidden = !passa;
      if (passa) triaAvis.textContent =
        `Amb més de ${MAX_CODI} preguntes el codi de verificació del final es queda curt i l'analitzador no el sabrà llegir.`;
    }

    function updateLink() {
      const params = new URLSearchParams();
      params.append('p', selPractica.value);
      if (selNivell.value) params.append('nivell', selNivell.value);
      if (selAny.value) params.append('any', selAny.value);
      if (selDificultat.value) params.append('dificultat', selDificultat.value);
      if (selSentit.value) params.append('sentit', selSentit.value);
      if (bancPreguntes && preguntesFiltrades.length && triades.size < preguntesFiltrades.length) {
        params.append('q', comprimeixIds(triades));
      }
      outputLink.value = BASE_URL + '?' + decodeURIComponent(params.toString());
    }

    function refrescarTria() {
      recalcularFiltrades();
      pintarLlista();
      pintarEstatTria();
      updateLink();
    }

    btnTria.addEventListener('click', () => {
      const obert = triaPanel.hidden;
      triaPanel.hidden = !obert;
      btnTria.setAttribute('aria-expanded', String(obert));
    });

    triaLlista.addEventListener('change', ev => {
      const caixa = ev.target.closest('input[type="checkbox"]');
      if (!caixa) return;
      const id = Number(caixa.dataset.id);
      caixa.checked ? triades.add(id) : triades.delete(id);
      pintarEstatTria();
      updateLink();
    });

    document.getElementById('tria-totes').addEventListener('click', () => {
      triades = new Set(preguntesFiltrades.map(p => p.id));
      pintarLlista(); pintarEstatTria(); updateLink();
    });

    document.getElementById('tria-cap').addEventListener('click', () => {
      triades.clear();
      pintarLlista(); pintarEstatTria(); updateLink();
    });

    selNivell.addEventListener('change', actualitzarAnys);
    [selAny, selDificultat, selSentit].forEach(sel => sel.addEventListener('change', refrescarTria));
    selPractica.addEventListener('change', updateLink);

    btnCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(outputLink.value);
        statusMsg.textContent = 'Copiat ✅';
        setTimeout(() => statusMsg.textContent = '', 2000);
      } catch (err) {
        outputLink.select(); document.execCommand('copy');
        statusMsg.textContent = 'Copiat ✅';
        setTimeout(() => statusMsg.textContent = '', 2000);
      }
    });

    btnOpen.addEventListener('click', () => window.open(outputLink.value, '_blank'));

    window.addEventListener('load', () => {
      actualitzarAnys();
      carregarAnysDelBanc();
      setTimeout(() => {
        selPractica.classList.add('select-atencio-shake');
        setTimeout(() => selPractica.classList.remove('select-atencio-shake'), 2500);
      }, 500);
    });    
  </script>
